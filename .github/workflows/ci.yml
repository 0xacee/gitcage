name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test tools
        shell: ${{ matrix.shell }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.24.0 -Scope CurrentUser -Force

      - name: Validate module manifest
        shell: ${{ matrix.shell }}
        run: Test-ModuleManifest -Path ./GitCage.psd1 | Format-List

      - name: Analyze PowerShell
        shell: ${{ matrix.shell }}
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error)
          $findings | Format-Table -Wrap -AutoSize
          if ($findings.Count -gt 0) {
            throw "PSScriptAnalyzer found $($findings.Count) blocking issue(s)."
          }

      - name: Run Pester
        shell: ${{ matrix.shell }}
        run: Invoke-Pester -Path ./tests -Output Detailed

  shell:
    name: Shell assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Bash syntax
        run: bash -n assets/*.sh

      - name: Reject committed credentials
        run: |
          if git grep -nE '(gho_|github_pat_)[A-Za-z0-9_]+' -- ':!tests/*'; then
            echo 'A GitHub credential pattern was found in tracked files.' >&2
            exit 1
          fi
